name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  pr-checks:
    name: Pull Request Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version and debug info
        run: |
          forge --version
          echo "Current directory: $(pwd)"
          echo "Files in src/:"
          ls -la src/ || echo "No src directory"
          echo "Files in test/:"
          ls -la test/ || echo "No test directory"
          echo "Foundry profile: $FOUNDRY_PROFILE"

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run All Tests (PR)
        run: |
          echo "Running comprehensive test suite for PR validation..."
          echo "PR should contain all necessary contracts and tests"

          # Build contracts
          echo "Building contracts..."
          forge build --sizes

          # Run all tests
          echo "Running all tests..."
          forge test -vvv
        id: test

      - name: Generate Test Coverage
        run: |
          echo "Generating coverage for PR test suite..."
          forge coverage --report summary || echo "Coverage summary failed"
          forge coverage --report lcov || echo "LCOV format not available, skipping"
        id: coverage
        continue-on-error: true

      - name: Upload Coverage to Codecov
        if: success() && hashFiles('lcov.info') != ''
        uses: codecov/codecov-action@v3
        with:
          file: ./lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security-checks:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Slither Analysis
        run: |
          pip3 install slither-analyzer
          slither . --print human-summary || echo "Slither analysis completed with warnings"
        continue-on-error: true

      - name: Run Mythril Analysis
        run: |
          pip3 install mythril
          myth analyze src/ --solv 0.8.30 || echo "Mythril analysis completed with warnings"
        continue-on-error: true

  gas-analysis:
    name: Gas Usage Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Generate Gas Report
        run: |
          forge test --gas-report > gas-report.txt
          echo "## Gas Usage Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat gas-report.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        id: gas

      - name: Upload Gas Report
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: gas-report.txt



  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Documentation
        run: |
          # Check if README is updated
          if [ -f "README.md" ]; then
            echo "✅ README.md exists"
          else
            echo "❌ README.md missing"
            exit 1
          fi
          
          # Check for documentation in docs/
          if [ -d "docs" ]; then
            echo "✅ Documentation directory exists"
            echo "Documentation files:"
            find docs/ -name "*.md" -type f
          else
            echo "⚠️ No docs directory found"
          fi

      - name: Validate Contract Documentation
        run: |
          # Check for NatSpec documentation in contracts
          echo "Checking for NatSpec documentation..."
          grep -r "@title\|@notice\|@dev\|@param\|@return" src/ || echo "⚠️ Limited NatSpec documentation found"

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [pr-checks, security-checks, gas-analysis]
    if: always()
    steps:
      - name: Generate PR Summary
        run: |
          echo "## Pull Request Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.pr-checks.result }}" == "success" ]; then
            echo "✅ **Tests**: All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests**: Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.security-checks.result }}" == "success" ]; then
            echo "✅ **Security**: No critical issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Security**: Review security analysis" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.gas-analysis.result }}" == "success" ]; then
            echo "✅ **Gas**: Analysis completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Gas**: Analysis failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target**: ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
