name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          # Check if inheritance contracts exist
          if [ -f "src/InheritanceModule.sol" ]; then
            echo "Inheritance contracts found, running all tests..."
            forge test -vvv
          else
            echo "Inheritance contracts not found, running core tests only..."
            # Temporarily move inheritance test files to avoid compilation errors
            mkdir -p temp_tests
            mv test/Inheritance*.t.sol temp_tests/ 2>/dev/null || true

            # Run tests without inheritance files
            forge test -vvv

            # Restore inheritance test files
            mv temp_tests/Inheritance*.t.sol test/ 2>/dev/null || true
            rmdir temp_tests 2>/dev/null || true
          fi
        id: test
