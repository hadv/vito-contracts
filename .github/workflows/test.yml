name: Main CI

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  main-ci:
    name: Main Branch Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Tests
        run: |
          echo "Running tests for main branch..."
          # Main branch should contain stable, working contracts
          # No conditional logic needed - just run what's available
          forge test -vvv
        id: test

  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: main-ci
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check Contract Sizes
        run: |
          forge build --sizes
          echo "## Contract Sizes" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          forge build --sizes >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate Deployment Artifacts
        run: |
          # Create deployment-ready artifacts
          mkdir -p deployment/
          cp -r out/ deployment/
          echo "Deployment artifacts generated"

      - name: Upload Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: deployment/
